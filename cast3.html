<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>キャスト名 | VRChatイベント</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <a class="home" href="index.html" aria-label="ホーム"><svg viewBox="0 0 24 24"><path d="M12 3 2 12h3v8h5v-5h4v5h5v-8h3z"/></svg></a>
  <nav><a href="index.html#regular">営業案内</a><a class="sp" href="index.html#special">特別営業</a></nav>
</header>

<main class="profile">
  <div class="p-photo slider">
    <!-- 写真を増やす: input と slide をそれぞれ1つ追加し、矢印のfor番号を揃える -->
    <input type="radio" name="pose" id="pose1" checked>
    <input type="radio" name="pose" id="pose2">
    <input type="radio" name="pose" id="pose3">
    <div class="slide">
      <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 300'%3E%3Ccircle cx='100' cy='70' r='45' fill='%23b9a8ff'/%3E%3Cpath d='M30 300c0-90 30-150 70-150s70 60 70 150z' fill='%23b9a8ff'/%3E%3Ctext x='100' y='240' font-size='22' text-anchor='middle' fill='%23fff' font-family='sans-serif'%3ESAMPLE%3C/text%3E%3C/svg%3E" alt="キャスト名 1">
      <label class="arrow prev" for="pose3" aria-label="前の写真">&#8249;</label>
      <label class="arrow next" for="pose2" aria-label="次の写真">&#8250;</label>
    </div>
    <div class="slide">
      <img src="img/cast1-pose2.svg" alt="キャスト名 2">
      <label class="arrow prev" for="pose1" aria-label="前の写真">&#8249;</label>
      <label class="arrow next" for="pose3" aria-label="次の写真">&#8250;</label>
    </div>
    <div class="slide">
      <img src="img/cast1-pose3.svg" alt="キャスト名 3">
      <label class="arrow prev" for="pose2" aria-label="前の写真">&#8249;</label>
      <label class="arrow next" for="pose1" aria-label="次の写真">&#8250;</label>
    </div>
  </div>
  <div class="p-body">
    <span class="tag">キャスト</span>
    <h1>キャスト名</h1>
    <span class="en">CAST NAME</span>
    <p class="p-msg">ここに自己紹介文が入ります。VRChatでの活動や、イベントでの役割、ファンへのメッセージなどを書いてください。</p>
    <dl>
      <dt>誕生日</dt><dd>1月1日</dd>
      <dt>身長</dt><dd>160cm</dd>
      <dt>好きなもの</dt><dd>音楽・ゲーム</dd>
      <dt>出勤曜日</dt><dd>毎週〇曜日</dd>
      <dt>ひとこと</dt><dd>よろしくお願いします！</dd>
    </dl>
    <div class="p-links">
      <a href="#" target="_blank" rel="noopener">X @account</a>
      <a href="index.html#cast">&larr; CAST一覧へ</a>
    </div>
  </div>
  <section class="gallery" id="gallery">
    <h2>GALLERY</h2>
    <p class="g-note">写真をクリックすると拡大して見られます</p>
    <div class="g-grid">
      <!-- 写真を増やす: サムネ行と、下の拡大用ブロックをそれぞれコピーし、番号(photoN)を揃える -->
      <a class="g-item" href="#photo1"><img src="img/photo-sample1.svg" alt="写真1"></a>
      <a class="g-item" href="#photo2"><img src="img/photo-sample2.svg" alt="写真2"></a>
      <a class="g-item" href="#photo3"><img src="img/photo-sample3.svg" alt="写真3"></a>
      <a class="g-item" href="#photo4"><img src="img/photo-sample4.svg" alt="写真4"></a>
    </div>
    <div class="lb" id="photo1">
      <a class="lb-bg" href="#gallery" aria-label="閉じる"></a>
      <img src="img/photo-sample1.svg" alt="写真1">
      <a class="lb-close" href="#gallery" aria-label="閉じる">&times;</a>
      <a class="lb-prev" href="#photo4" aria-label="前へ">&#8249;</a>
      <a class="lb-next" href="#photo2" aria-label="次へ">&#8250;</a>
    </div>
    <div class="lb" id="photo2">
      <a class="lb-bg" href="#gallery" aria-label="閉じる"></a>
      <img src="img/photo-sample2.svg" alt="写真2">
      <a class="lb-close" href="#gallery" aria-label="閉じる">&times;</a>
      <a class="lb-prev" href="#photo1" aria-label="前へ">&#8249;</a>
      <a class="lb-next" href="#photo3" aria-label="次へ">&#8250;</a>
    </div>
    <div class="lb" id="photo3">
      <a class="lb-bg" href="#gallery" aria-label="閉じる"></a>
      <img src="img/photo-sample3.svg" alt="写真3">
      <a class="lb-close" href="#gallery" aria-label="閉じる">&times;</a>
      <a class="lb-prev" href="#photo2" aria-label="前へ">&#8249;</a>
      <a class="lb-next" href="#photo4" aria-label="次へ">&#8250;</a>
    </div>
    <div class="lb" id="photo4">
      <a class="lb-bg" href="#gallery" aria-label="閉じる"></a>
      <img src="img/photo-sample4.svg" alt="写真4">
      <a class="lb-close" href="#gallery" aria-label="閉じる">&times;</a>
      <a class="lb-prev" href="#photo3" aria-label="前へ">&#8249;</a>
      <a class="lb-next" href="#photo1" aria-label="次へ">&#8250;</a>
    </div>
  </section>
</main>

<footer><small>&copy; 2026 Event Name. All rights reserved.</small></footer>
</body>
</html>
